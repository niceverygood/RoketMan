<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1322" />
    <title>폭탄 키우기</title>
    <meta
      name="description"
      content="해안 발사장에서 미사일을 키우고 발사해, 3D 복셀 도시를 무너뜨린 만큼 포인트를 모으는 성장형 게임."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="gl" aria-label="3D 발사장과 목표 도시"></canvas>
        <div id="labels"></div>
        <div class="hud" id="hud" hidden>
          <div class="grp"><span class="lbl">목표</span><span id="hCity">느티 마을</span></div>
          <div class="grp"><span class="lbl">탄두</span><span class="ammo" id="hAmmo"></span></div>
          <div class="grp">
            <span class="lbl">파괴율</span
            ><span class="bar" title="35%를 넘기면 다음 도시 해금"><b id="hBar"></b><s></s></span
            ><span class="num" id="hPct">0%</span>
          </div>
          <div class="grp"><span class="lbl">포인트</span><span class="num" id="hPts">0</span></div>
          <span class="sp"></span>
          <button class="hbtn mute" type="button">소리 켜짐</button>
          <button class="hbtn" id="retreat" type="button">철수</button>
        </div>
        <div class="plate" id="plate">
          <span class="eyebrow">LAB-07 해안 발사장</span>
          <b id="pName">키움 1호</b>
          <span class="mono" id="pSpec">전장 33m · 탄두 3발</span>
        </div>
        <div id="banner" hidden></div>
        <div id="combo" hidden></div>
        <div id="prompt" hidden></div>
        <div id="toast" role="status" hidden></div>
        <div id="err" hidden></div>
      </div>
      <aside id="panel" aria-label="폭탄 연구실">
        <div class="pscroll">
          <div class="eyebrow">LAB-07 · 지하 폭탄 연구실</div>
          <h1>폭탄 키우기</h1>
          <p class="tag">주민은 모두 대피했습니다. 미사일을 키우고, 쏘고, 무너진 만큼 다시 키우세요.</p>
          <div class="wallet">
            <div><span class="lbl">연구 포인트</span><span class="num" id="lPts">0</span></div>
            <div class="rank"><b id="rankName">불꽃놀이 폭죽</b><span id="rankLv">총 개량 0단계</span></div>
          </div>
          <div class="stripe"></div>
          <h2>개량 항목</h2>
          <div class="upgs" id="upgs"></div>
          <h2 class="mt">목표 도시</h2>
          <div class="cities" id="cities"></div>
          <h2 class="mt">그래픽</h2>
          <div class="seg" id="gfx" role="group" aria-label="그래픽 품질">
            <button type="button" data-q="auto" aria-pressed="true">자동</button>
            <button type="button" data-q="high" aria-pressed="false">높음</button>
            <button type="button" data-q="mid" aria-pressed="false">보통</button>
            <button type="button" data-q="low" aria-pressed="false">낮음</button>
          </div>
          <p class="note" id="gfxNote"></p>
          <button class="ghost" id="reset" type="button">기록 초기화</button>
        </div>
        <div class="pfoot">
          <button class="hbtn mute" type="button">소리 켜짐</button>
          <button class="go" id="go" type="button">출격</button>
        </div>
      </aside>
    </div>
    <div id="wipe" hidden></div>
    <div class="overlay" id="result" hidden>
      <div class="card">
        <div class="stripe"></div>
        <div class="card-body">
          <div class="eyebrow">작전 보고서</div>
          <h2 id="rTitle">작전 성공</h2>
          <div>
            <div class="lbl">이번 출격 획득</div>
            <div class="big" id="rEarn">+0 P</div>
          </div>
          <div class="rows">
            <div><span>파괴한 블록</span><b id="rBlocks">0</b></div>
            <div><span>파괴율</span><b id="rPct">0%</b></div>
            <div><span>최대 연쇄</span><b id="rCombo">0</b></div>
            <div><span>보유 포인트</span><b id="rPts">0</b></div>
          </div>
          <div class="unlock" id="rUnlock" hidden></div>
          <div class="btns">
            <button class="ghost" id="again" type="button">바로 다시 출격</button>
            <button class="go sm" id="toLab" type="button">연구실로</button>
          </div>
        </div>
      </div>
    </div>
    <!-- three.js r128 고정(저장소에 동봉). 버전을 올리면 조명·색 처리 방식이 바뀌니 HANDOFF.md 의 주의사항을 먼저 읽을 것 -->
    <script src="vendor/three.r128.min.js"></script>
    <script src="js/01-data.js"></script>
    <script src="js/02-engine.js"></script>
    <script src="js/03-city.js"></script>
    <script src="js/04-game.js"></script>
  </body>
</html>
